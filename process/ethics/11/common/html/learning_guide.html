<!DOCTYPE html>
<html>
<head>
<title></title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    
    <!-- 기본실행 스크립트 -->
	<script type="text/javascript" src="../js/jquery-1.12.3.min.js"></script>
	<link href="../css/guide.css" rel="stylesheet">
</head>

<body >
<div class="mbody">
	<div class="con_menu">
    	<div id="con_menu1"><img src="../img/guide/m1_on.png" class="menu m1" title="과정개요"></div>
        <div id="con_menu2"><img src="../img/guide/m2.png" class="menu m2" title="학습구성"></div>
        <div id="con_menu3"><img src="../img/guide/m3.png" class="menu m3" title="화면구조"></div>
        <div id="con_menu4"><img src="../img/guide/m4.png" class="menu m4" title="학습환경"></div>
	</div>
	<div>
		<div class="con_body" >
			<div class="m_con m1"><img src="../img/guide/c1.png"></div>
		    <div class="m_con m2"><img src="../img/guide/c2.png"></div>
		    <div class="m_con m3"><img src="../img/guide/c3.png"></div>
		    <div class="m_con m4"><img src="../img/guide/c4.png"></div>
		</div>
	</div>

</div>
	<script>
	    $('.con_menu .menu').each(function (i){
	        $(this).click(function ()
	
	        {
	        	var clickNum = i+1;
				var scr =  $(".menu.m" + (i + 1)).attr('src');
	            
	            reset_item_src(clickNum);
	            
	            $(".m_con").hide();
	            $(".m_con.m" + (i + 1)).show();
	        });
	    });
	
	    function reset_item_src(clickNum)
	    {
	        $('.con_menu .menu').each(function (i) {
	        	var num = i+1;
	        	$(".menu.m" + (i + 1)).attr('src', '../img/guide/m'+num+'.png');
	
	        	if(clickNum == num){
					$(".menu.m" + (i + 1)).attr('src', '../img/guide/m'+clickNum+'_on.png');
	        		
	        	}

	        });
	    }

	    $(".m_con.m" + 1).show();

	</script>
</body>


</html>
